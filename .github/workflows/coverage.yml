# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'

name: Coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-coverage:
    if: contains(github.event.head_commit.message, '[ci skip]') == false
    name: test-coverage (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      _R_CHECK_CRAN_INCOMING_: false
      # Each test worker starts a server with its own R worker pools. Coverage
      # instrumentation makes those subprocesses costly on the shared runner.
      TESTTHAT_CPUS: 2

    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Select coverage tests
        run: |
          Rscript .github/check-coverage-shards.R --partition-only
          Rscript .github/coverage-shards.R ${{ strategy.job-total }} ${{ matrix.shard }}

      - name: Test coverage
        env:
          TESTTHAT_TIMINGS: ${{ runner.temp }}/coverage-timings.csv
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}
      - uses: codecov/codecov-action@v7
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          flags: shard-${{ matrix.shard }}
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/package

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-timings-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-timings.csv
          if-no-files-found: warn
