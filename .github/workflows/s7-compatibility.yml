name: S7 compatibility

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  s7-compatibility:
    runs-on: ubuntu-latest
    name: S7 (${{ matrix.s7 }})
    strategy:
      fail-fast: false
      matrix:
        s7: ["0.2.2", "1.0.0"]
    env:
      NOT_CRAN: true
      TESTTHAT_CPUS: 1
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
      - name: Install released S7
        env:
          S7_VERSION: ${{ matrix.s7 }}
        run: remotes::install_version("S7", version = Sys.getenv("S7_VERSION"), upgrade = "never")
        shell: Rscript {0}
      - name: Install languageserver
        run: R CMD INSTALL .
      - name: Test member providers
        run: |
          message("Testing S7 ", packageVersion("S7"))
          testthat::test_local(filter = "^member-|s7|class-declaration", load_package = "installed", reporter = "summary")
        shell: Rscript {0}
